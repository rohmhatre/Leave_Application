<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leave Application Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fb; }
        .card { border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
        .hero { padding: 40px 0; }
        .brand { font-weight:700; color:#0d6efd; }
    </style>
</head>
<body>
<div class="container hero">
  <div class="row mb-4">
    <div class="col text-center">
      <h1 class="brand">Leave Application Portal</h1>

    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card p-4">
        <h3>Student Login</h3>

        {% if messages %}
          <div>
            {% for message in messages %}
              <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="login_type" value="student">
          <div class="mb-3">
            <label class="form-label">Roll number</label>
            <input class="form-control" name="roll_number" placeholder="e.g. 25m0005">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password">
          </div>
          <button class="btn btn-primary">Student Login</button>
        </form>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-4">
        <h3>Approver Login</h3>
        <p class="text-muted">For faculty advisors and supervisors.</p>
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="login_type" value="approver">
          <div class="mb-3">
            <label class="form-label">User ID</label>
            <input class="form-control" name="roll_number" placeholder="Approver ID">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password">
          </div>
          <button class="btn btn-outline-success">Approver Login</button>
        </form>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-4">
        <h3>Admin Login</h3>
        <p class="text-muted">For administrators only.</p>
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="login_type" value="admin">
          <div class="mb-3">
            <label class="form-label">User ID</label>
            <input class="form-control" name="roll_number" placeholder="ADMIN">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password">
          </div>
          <button class="btn btn-outline-primary">Admin Login</button>
        </form>
      </div>
    </div>
  </div>

  
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
